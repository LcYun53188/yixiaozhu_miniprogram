services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    container_name: yixiaozhu-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yixiaozhu}
      MYSQL_USER: ${MYSQL_USER:-yixiaozhu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yixiaozhu_dev}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yixiaozhu-dev

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: yixiaozhu-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yixiaozhu_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yixiaozhu}
      MYSQL_USER: ${MYSQL_USER:-yixiaozhu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-yixiaozhu_dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - yixiaozhu-dev

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5.2}
    container_name: yixiaozhu-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-yixiaozhu}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-yixiaozhu_dev}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yixiaozhu-dev

volumes:
  mysql_data:
  backend_node_modules:

networks:
  yixiaozhu-dev:
    driver: bridge
